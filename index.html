<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KANAZAWA CITY TIP</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 25px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .title {
      font-size: 14px;
      letter-spacing: 4px;
      color: #aaa;
    }

    .location-name {
      margin-top: 6px;
      font-size: 24px;
    }

    .gps-status {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    #map {
      width: 100%;
      height: 420px;
    }

    .content {
      padding: 25px;
      display: flex;
      gap: 25px;
      align-items: center;
      justify-content: center;
    }

    .character {
      width: 180px;
      max-height: 260px;
      object-fit: contain;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .tip-box {
      max-width: 500px;
      padding: 25px;
      background: #f5f5f5;
      color: #111;
      border-radius: 15px;
    }

    .tip-label {
      font-size: 11px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 12px;
    }

    .tip-text {
      font-size: 19px;
      line-height: 1.7;
    }

    .gps-button {
      margin: 0 auto 30px;
      display: block;
      padding: 12px 22px;
      background: white;
      color: #111;
      border: none;
      border-radius: 25px;
      font-size: 15px;
      cursor: pointer;
    }

    .gps-button:hover {
      background: #ddd;
    }

    .current-marker {
      width: 16px;
      height: 16px;
      background: #111;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(255,255,255,0.25);
    }

    @media (max-width: 700px) {

      #map {
        height: 350px;
      }

      .content {
        flex-direction: column;
      }

      .character {
        width: 140px;
        max-height: 200px;
      }

      .tip-text {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="title">
      KANAZAWA CITY LOADING...
    </div>

    <div class="location-name" id="locationName">
      現在地を取得しています...
    </div>

    <div class="gps-status" id="gpsStatus">
      GPS SIGNAL : WAITING
    </div>

  </div>

  <div id="map"></div>

  <div class="content">

    <img
      src="tips-character.png"
      class="character"
      alt="CITY TIP キャラクター"
    >

    <div class="tip-box">

      <div class="tip-label">
        💡 CITY TIP
      </div>

      <div class="tip-text" id="tipText">
        現在地を取得しています...
      </div>

    </div>

  </div>

  <button
    class="gps-button"
    onclick="getLocation()"
  >
    📍 現在地を更新
  </button>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

  /*
  =====================================
  CITY TIP の場所データ
  =====================================
  */

  const places = [

    {
      name: "金沢駅",
      lat: 36.5781,
      lng: 136.6476,
      radius: 500,
      tip: "金沢の玄関口。ここから街の探索を始めよう。"
    },

    {
      name: "片町",
      lat: 36.5615,
      lng: 136.6546,
      radius: 500,
      tip: "昼と夜で街の表情が変わるエリア。人の流れを観察してみよう。"
    },

    {
      name: "香林坊",
      lat: 36.5626,
      lng: 136.6540,
      radius: 400,
      tip: "人や車の流れが集まる場所。周囲の動きを見て歩こう。"
    },

    {
      name: "竪町",
      lat: 36.5603,
      lng: 136.6530,
      radius: 400,
      tip: "歩いていると、店や人の雰囲気が少しずつ変わっていく。"
    },

    {
      name: "東山",
      lat: 36.5728,
      lng: 136.6655,
      radius: 500,
      tip: "歴史的な街並みが残るエリア。普段とは違う街の見方ができるかも。"
    }

  ];


  /*
  =====================================
  地図
  =====================================
  */

  const map = L.map("map").setView(
    [36.568, 136.655],
    14
  );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "© OpenStreetMap contributors"
    }
  ).addTo(map);


  /*
  =====================================
  現在地マーカー
  =====================================
  */

  const currentIcon = L.divIcon({

    className: "",

    html:
      '<div class="current-marker"></div>',

    iconSize: [16, 16],

    iconAnchor: [8, 8]

  });


  let currentMarker = null;


  /*
  =====================================
  GPS取得
  =====================================
  */

  function getLocation() {

    const status =
      document.getElementById("gpsStatus");

    const locationName =
      document.getElementById("locationName");

    const tipText =
      document.getElementById("tipText");


    status.textContent =
      "GPS SIGNAL : SEARCHING...";

    locationName.textContent =
      "現在地を探しています...";

    tipText.textContent =
      "衛星を探しています。少々お待ちください。";


    if (!navigator.geolocation) {

      status.textContent =
        "GPS SIGNAL : NOT SUPPORTED";

      tipText.textContent =
        "このブラウザでは位置情報を取得できません。";

      return;
    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        status.textContent =
          "GPS SIGNAL : CONNECTED";


        /*
        現在地マーカーを作る
        */

        if (currentMarker) {

          currentMarker.setLatLng([lat, lng]);

        } else {

          currentMarker =
            L.marker(
              [lat, lng],
              {
                icon: currentIcon
              }
            ).addTo(map);

        }


        /*
        地図を現在地へ移動
        */

        map.flyTo(
          [lat, lng],
          16,
          {
            duration: 1.2
          }
        );


        /*
        一番近い場所を探す
        */

        let nearestPlace = null;

        let nearestDistance = Infinity;


        places.forEach(function(place) {

          const distance =
            getDistance(
              lat,
              lng,
              place.lat,
              place.lng
            );


          if (
            distance < nearestDistance
          ) {

            nearestDistance =
              distance;

            nearestPlace =
              place;

          }

        });


        /*
        CITY TIPを表示
        */

        if (
          nearestPlace &&
          nearestDistance <= nearestPlace.radius
        ) {

          locationName.textContent =
            nearestPlace.name;

          tipText.textContent =
            nearestPlace.tip;

        } else {

          locationName.textContent =
            "金沢・探索中";

          tipText.textContent =
            "この場所には、まだCITY TIPがありません。街を歩いて新しい発見を探してみよう。";

        }

      },


      function(error) {

        status.textContent =
          "GPS SIGNAL : ERROR";

        locationName.textContent =
          "位置情報を取得できませんでした";

        tipText.textContent =
          "ブラウザの位置情報を許可しているか確認してください。";

      },

      {

        enableHighAccuracy: true,

        timeout: 10000,

        maximumAge: 0

      }

    );

  }


  /*
  =====================================
  2地点間の距離を計算
  =====================================
  */

  function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
  ) {

    const R = 6371000;

    const dLat =
      (lat2 - lat1)
      * Math.PI / 180;

    const dLon =
      (lon2 - lon1)
      * Math.PI / 180;


    const a =
      Math.sin(dLat / 2)
      * Math.sin(dLat / 2)
      +
      Math.cos(lat1 * Math.PI / 180)
      *
      Math.cos(lat2 * Math.PI / 180)
      *
      Math.sin(dLon / 2)
      *
      Math.sin(dLon / 2);


    const c =
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );


    return R * c;

  }


  /*
  ページを開いたらGPS取得
  */

  getLocation();

</script>

</body>
</html>
